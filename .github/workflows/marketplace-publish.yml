name: Publish VS Code Marketplace

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Existing GitHub release version without the v prefix, for example 2.0.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: marketplace-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Marketplace OIDC preflight
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version '$VERSION'." >&2
            exit 1
          fi
          TAG="v${VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Install current Marketplace publisher
        run: |
          npm install --global @vscode/vsce@3.9.2
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "vsce: $(vsce --version)"

      - name: Public Gallery API preflight
        shell: bash
        run: |
          set -euo pipefail
          BODY='{"filters":[{"criteria":[{"filterType":7,"value":"masota.swahilipro"}],"pageNumber":1,"pageSize":1,"sortBy":0,"sortOrder":0}],"assetTypes":[],"flags":914}'
          HTTP_CODE="$(curl --silent --show-error \
            --connect-timeout 15 \
            --max-time 45 \
            --output /tmp/marketplace-gallery.json \
            --write-out '%{http_code}' \
            --header 'Accept: application/json;api-version=7.1-preview.1;excludeUrls=true' \
            --header 'Content-Type: application/json' \
            --data "$BODY" \
            'https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery?api-version=7.1-preview.1')"

          echo "Marketplace public Gallery API HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Public Gallery API preflight failed before any upload was attempted." >&2
            cat /tmp/marketplace-gallery.json || true
            exit 1
          fi

      - name: GitHub OIDC and Marketplace trust preflight
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "GitHub did not expose OIDC token request variables. Check permissions: id-token: write." >&2
            exit 1
          fi

          TOKEN_URL="$(node -e 'const u=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL); u.searchParams.set("audience", "marketplace.visualstudio.com"); process.stdout.write(u.toString())')"

          OIDC_JSON="$(curl --silent --show-error --fail-with-body \
            --connect-timeout 15 \
            --max-time 45 \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --header 'Accept: application/json' \
            "$TOKEN_URL")"

          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | node -e 'let s=""; process.stdin.on("data",d=>s+=d); process.stdin.on("end",()=>{const v=JSON.parse(s).value; if(!v) process.exit(2); process.stdout.write(v);});')"
          unset OIDC_JSON

          HTTP_CODE="$(curl --silent --show-error \
            --connect-timeout 15 \
            --max-time 60 \
            --output /tmp/marketplace-oidc.json \
            --write-out '%{http_code}' \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header 'Content-Type: application/json' \
            --header 'User-Agent: vsce' \
            --data '{"publisherName":"masota"}' \
            'https://marketplace.visualstudio.com/_apis/gallery/token')"
          unset OIDC_TOKEN

          echo "Marketplace OIDC token exchange HTTP status: $HTTP_CODE"
          if ! [[ "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
            echo "Marketplace rejected the GitHub OIDC identity. Configure a trusted publishing policy for publisher 'masota' that trusts this repository and workflow." >&2
            node -e 'const fs=require("fs"); const p="/tmp/marketplace-oidc.json"; try { const v=JSON.parse(fs.readFileSync(p,"utf8")); console.error(v.message || v.error_description || v.error || `HTTP response without a Marketplace error message`); } catch { console.error("Marketplace returned a non-JSON error response."); }'
            rm -f /tmp/marketplace-oidc.json
            exit 1
          fi

          node -e 'const fs=require("fs"); const p="/tmp/marketplace-oidc.json"; const v=JSON.parse(fs.readFileSync(p,"utf8")); if(!v.credential) throw new Error("Marketplace OIDC exchange succeeded but returned no credential");'
          rm -f /tmp/marketplace-oidc.json
          echo "GitHub OIDC identity is trusted by Marketplace for publisher 'masota'."

  publish:
    name: Publish ${{ matrix.target }}
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target:
          - darwin-arm64
          - darwin-x64
          - linux-x64
          - win32-x64
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          TAG="v${VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Download platform VSIX from GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          gh release download "${{ steps.release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "swahilipro-${{ matrix.target }}.vsix" \
            --dir publish
          test -f "publish/swahilipro-${{ matrix.target }}.vsix"
          ls -lh "publish/swahilipro-${{ matrix.target }}.vsix"

      - name: Install current Marketplace publisher
        run: |
          npm install --global @vscode/vsce@3.9.2
          echo "Node: $(node --version)"
          echo "vsce: $(vsce --version)"

      - name: Publish with OIDC and transient-only retries
        shell: bash
        run: |
          set -euo pipefail

          VSIX="publish/swahilipro-${{ matrix.target }}.vsix"
          MAX_ATTEMPTS=4
          ATTEMPT=1

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "Publishing $VSIX with OIDC (attempt $ATTEMPT/$MAX_ATTEMPTS)"
            STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Started: $STARTED_AT"

            set +e
            OUTPUT="$(vsce publish --packagePath "$VSIX" --oidc 2>&1)"
            STATUS=$?
            set -e

            FINISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Finished: $FINISHED_AT"
            printf '%s\n' "$OUTPUT"

            if [ "$STATUS" -eq 0 ]; then
              echo "Published ${{ matrix.target }} successfully."
              exit 0
            fi

            # A prior request can be accepted by Marketplace even if the response times out.
            if printf '%s\n' "$OUTPUT" | grep -Eiq 'already.*(exist|publish)|version .* (exists|published)|already been published'; then
              echo "This platform/version is already on the Marketplace; treating it as success."
              exit 0
            fi

            # Retry only genuine transient network/service errors. Authentication/policy/package errors fail immediately.
            TRANSIENT_PATTERN='request timeout|timed out|timeout|ETIMEDOUT|ESOCKETTIMEDOUT|ECONNRESET|ECONNREFUSED|EAI_AGAIN|ENOTFOUND|EPIPE|socket hang up|connection reset|fetch failed|temporary failure|temporarily unavailable|service unavailable|bad gateway|gateway timeout|internal server error|too many requests|rate limit|HTTP[^0-9]*(408|425|429|500|502|503|504)|status[^0-9]*(408|425|429|500|502|503|504)'

            if ! printf '%s\n' "$OUTPUT" | grep -Eiq "$TRANSIENT_PATTERN"; then
              echo "Publish failed with a non-transient error; not retrying." >&2
              exit "$STATUS"
            fi

            if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
              echo "Transient publishing failure persisted after $MAX_ATTEMPTS attempts." >&2
              exit "$STATUS"
            fi

            WAIT_SECONDS=$((15 * (1 << (ATTEMPT - 1))))
            echo "Transient Marketplace/network failure detected. Retrying in ${WAIT_SECONDS}s."

            set +e
            vsce show masota.swahilipro --json >/tmp/vsce-pre-retry.json 2>/tmp/vsce-pre-retry.err
            PREFLIGHT_STATUS=$?
            set -e
            if [ "$PREFLIGHT_STATUS" -ne 0 ]; then
              echo "Marketplace read preflight is also failing before retry $((ATTEMPT + 1)):" >&2
              cat /tmp/vsce-pre-retry.err >&2 || true
            else
              echo "Marketplace read preflight succeeded before retry $((ATTEMPT + 1))."
            fi

            sleep "$WAIT_SECONDS"
            ATTEMPT=$((ATTEMPT + 1))
          done
