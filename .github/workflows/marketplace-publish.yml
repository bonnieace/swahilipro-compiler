name: Publish VS Code Marketplace

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      VSCE_PAT:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: "Existing GitHub release version without the v prefix, for example 2.0.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: marketplace-masota
  cancel-in-progress: false

env:
  AZURE_DEVOPS_RESOURCE: 499b84ac-1321-427f-aa17-267ca6975798
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}

jobs:
  preflight:
    name: Marketplace Entra preflight
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate release and configuration
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version '$VERSION'." >&2
            exit 1
          fi
          test -n "${{ vars.AZURE_CLIENT_ID }}" || { echo "Repository variable AZURE_CLIENT_ID is not configured." >&2; exit 1; }
          test -n "${{ vars.AZURE_TENANT_ID }}" || { echo "Repository variable AZURE_TENANT_ID is not configured." >&2; exit 1; }
          gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Install supported Marketplace publisher
        run: |
          npm install --global @vscode/vsce@3.9.2
          echo "Node: $(node --version)"
          echo "vsce: $(vsce --version)"

      - name: Public Gallery API preflight
        shell: bash
        run: |
          set -euo pipefail
          BODY='{"filters":[{"criteria":[{"filterType":7,"value":"masota.swahilipro"}],"pageNumber":1,"pageSize":1,"sortBy":0,"sortOrder":0}],"assetTypes":[],"flags":914}'
          HTTP_CODE="$(curl --silent --show-error --connect-timeout 15 --max-time 45 \
            --output /tmp/marketplace-gallery.json --write-out '%{http_code}' \
            --header 'Accept: application/json;api-version=7.1-preview.1;excludeUrls=true' \
            --header 'Content-Type: application/json' --data "$BODY" \
            'https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery?api-version=7.1-preview.1')"
          echo "Marketplace public Gallery API HTTP status: $HTTP_CODE"
          test "$HTTP_CODE" = "200" || { cat /tmp/marketplace-gallery.json || true; exit 1; }

      - name: Sign in to Microsoft Entra with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Verify Marketplace/Azure DevOps access token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(az account get-access-token --resource "$AZURE_DEVOPS_RESOURCE" --query accessToken -o tsv)"
          test -n "$TOKEN"
          unset TOKEN
          echo "Microsoft Entra access token acquired for the Marketplace/Azure DevOps resource."

      - name: Resolve Marketplace identity
        shell: bash
        run: |
          set -euo pipefail
          echo "The ID below is the identity to add to publisher 'masota' as Contributor if it is not already a member:"
          az rest \
            --method get \
            --url 'https://app.vssps.visualstudio.com/_apis/profile/profiles/me' \
            --resource "$AZURE_DEVOPS_RESOURCE" \
            --query '{id:id,displayName:displayName}' \
            --output json

  publish:
    name: Publish ${{ matrix.target }}
    needs: preflight
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        target:
          - darwin-arm64
          - darwin-x64
          - linux-x64
          - win32-x64
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sign in to Microsoft Entra with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Download platform VSIX from GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          mkdir -p publish
          gh release download "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
            --pattern "swahilipro-${{ matrix.target }}.vsix" --dir publish
          test -f "publish/swahilipro-${{ matrix.target }}.vsix"
          ls -lh "publish/swahilipro-${{ matrix.target }}.vsix"

      - name: Install supported Marketplace publisher
        run: npm install --global @vscode/vsce@3.9.2

      - name: Publish with Entra identity and transient-only retries
        shell: bash
        run: |
          set -euo pipefail
          VSIX="publish/swahilipro-${{ matrix.target }}.vsix"
          MAX_ATTEMPTS=4
          ATTEMPT=1

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "Publishing $VSIX with Microsoft Entra identity (attempt $ATTEMPT/$MAX_ATTEMPTS)"
            set +e
            OUTPUT="$(NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/marketplace-diagnostics.cjs" vsce publish --packagePath "$VSIX" --azure-credential --skip-duplicate 2>&1)"
            STATUS=$?
            set -e
            printf '%s\n' "$OUTPUT"

            if [ "$STATUS" -eq 0 ]; then
              echo "Published or already present: ${{ matrix.target }}"
              exit 0
            fi

            if printf '%s\\n' "$OUTPUT" | grep -Eiq 'RequestBlockedException|VSID|too many requests|"status":429'; then
              echo "Microsoft throttled publishing. Stop here; inspect marketplace-diagnostic headers before retrying." >&2
              exit "$STATUS"
            fi

            TRANSIENT_PATTERN='request timeout|timed out|timeout|ETIMEDOUT|ESOCKETTIMEDOUT|ECONNRESET|ECONNREFUSED|EAI_AGAIN|ENOTFOUND|EPIPE|socket hang up|connection reset|fetch failed|temporary failure|temporarily unavailable|service unavailable|bad gateway|gateway timeout|internal server error|too many requests|rate limit|HTTP[^0-9]*(408|425|429|500|502|503|504)|status[^0-9]*(408|425|429|500|502|503|504)'
            if ! printf '%s\n' "$OUTPUT" | grep -Eiq "$TRANSIENT_PATTERN"; then
              echo "Publish failed with a non-transient authentication, permission, validation, or package error; not retrying." >&2
              exit "$STATUS"
            fi

            if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
              echo "Transient publishing failure persisted after $MAX_ATTEMPTS attempts." >&2
              exit "$STATUS"
            fi

            WAIT_SECONDS=$((120 * (1 << (ATTEMPT - 1))))
            echo "Transient Marketplace/network failure detected. Retrying in ${WAIT_SECONDS}s."
            sleep "$WAIT_SECONDS"
            ATTEMPT=$((ATTEMPT + 1))
          done
