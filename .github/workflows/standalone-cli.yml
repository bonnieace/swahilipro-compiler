name: standalone-cli

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - macos-15-intel
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pytest pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Build standalone swa binary
        run: pyinstaller --clean --onefile --name swa swa_cli.py

      - name: Verify standalone binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./dist/swa.exe --version
          else
            ./dist/swa --version
          fi

      - name: Give artifact a platform-specific filename
        shell: python
        run: |
          import os
          import platform
          import shutil
          from pathlib import Path

          suffix = ".exe" if os.name == "nt" else ""
          source = Path("dist") / f"swa{suffix}"
          system = platform.system().lower()
          machine = platform.machine().lower().replace("amd64", "x86_64")
          target = Path("dist") / f"swa-{system}-{machine}{suffix}"
          shutil.copy2(source, target)
          print(target)

      - name: Upload standalone binary
        uses: actions/upload-artifact@v4
        with:
          name: swa-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/swa-linux-*
            dist/swa-windows-*.exe
            dist/swa-darwin-*
          if-no-files-found: error
