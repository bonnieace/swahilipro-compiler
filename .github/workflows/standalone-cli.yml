name: standalone-cli

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - macos-15-intel
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pytest pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Build standalone CLI aliases
        shell: bash
        run: |
          pyinstaller --clean --onefile --name swa swa_cli.py
          pyinstaller --clean --onefile --name swahilipro swa_cli.py

      - name: Verify standalone binaries
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./dist/swa.exe -v
            ./dist/swahilipro.exe -v
            ./dist/swa.exe -help >/dev/null
            ./dist/swahilipro.exe -help >/dev/null
          else
            ./dist/swa -v
            ./dist/swahilipro -v
            ./dist/swa -help >/dev/null
            ./dist/swahilipro -help >/dev/null
          fi

      - name: Give artifacts platform-specific filenames
        shell: python
        run: |
          import os
          import platform
          import shutil
          from pathlib import Path

          suffix = ".exe" if os.name == "nt" else ""
          system = platform.system().lower()
          machine = platform.machine().lower().replace("amd64", "x86_64")

          for command in ("swa", "swahilipro"):
              source = Path("dist") / f"{command}{suffix}"
              target = Path("dist") / f"{command}-{system}-{machine}{suffix}"
              shutil.copy2(source, target)
              print(target)

      - name: Upload standalone binaries
        uses: actions/upload-artifact@v4
        with:
          name: swahilipro-cli-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/swa-linux-*
            dist/swa-windows-*.exe
            dist/swa-darwin-*
            dist/swahilipro-linux-*
            dist/swahilipro-windows-*.exe
            dist/swahilipro-darwin-*
          if-no-files-found: error
